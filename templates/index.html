<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agenda de Turnos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="text-center text-primary mb-4">Agenda de Turnos</h1>

    <table id="tablaTurnos" class="table table-striped table-bordered">
      <thead class="table-primary">
        <tr>
          <th>Nombre</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody>
        {% for turno in turnos %}
          <tr>
            <td>{{ turno["nombre"] }}</td>
            <td>{{ turno["fecha"] }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>

    <h2 class="mt-5">Agendar nuevo turno</h2>
    <form action="/agendar" method="post" class="row g-3">
      <div class="col-md-6">
        <input type="text" class="form-control" name="nombre" placeholder="Nombre" required>
      </div>
      <div class="col-md-6">
        <input type="text" class="form-control" name="fecha" placeholder="Fecha" required>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Agendar</button>
      </div>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script>
    $(document).ready(function() {
      $('#tablaTurnos').DataTable();
    });
  </script>
</body>
</html>
